[project]
name = "vexplorer"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.27.2,<1.28",
  "ezdxf>=1.4,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.18,<1",
  "python-dotenv>=1,<2",
  "Pillow>=12,<13",
  "numpy>=2,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "scikit-learn>=1.7,<2", "scipy>=1.13,<2", "joblib>=1.4,<2"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "scikit-learn>=1.7,<2", "scipy>=1.13,<2", "joblib>=1.4,<2"]
semantic-lab = ["numpy>=2,<3", "scipy>=1.13,<2", "scikit-learn>=1.7,<2", "matplotlib>=3.10,<4", "joblib>=1.4,<2"]
semantic-models = ["torch>=2.10,<3", "transformers[vision]>=5.23,<6", "sentence-transformers>=6.3,<7", "huggingface-hub>=1.31,<2"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tools*", "backend*", "evaluation*"]

[tool.setuptools.package-data]
"backend.app.validador" = ["*.json"]
