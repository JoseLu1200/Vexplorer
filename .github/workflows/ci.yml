name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
          cache: pip
      - name: Install checked Python environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements-demo.txt
          python -m pip install --disable-pip-version-check --constraint requirements-demo.txt ".[test]"
      - name: Python tests
        run: python -m pytest -q
      - name: Python package and dependency checks
        run: |
          python -m pip check
          python -m compileall -q backend/app tools
          python -m pip wheel --no-deps . --wheel-dir dist
      - uses: actions/setup-node@v6
        with:
          node-version: "24.11.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install and tests
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
      - name: Build production image
        run: docker build --tag vexplorer:ci .

  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
          cache: pip
      - name: Install application
        run: |
          python -m pip install --disable-pip-version-check -r requirements-demo.txt
          python -m pip install --disable-pip-version-check --constraint requirements-demo.txt ".[test]"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.11.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser workflow regressions
        working-directory: frontend
        run: npm run test:browser
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-regression-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/playwright-report/
            frontend/test-results/
